<!DOCTYPE html>
<html lang="as">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Price Comparison - আটাইতকৈ কম দাম</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .search-container {
            max-width: 500px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        input[type="text"] {
            width: 80%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #218838;
        }
        .results-container {
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="search-container">
        <h2>সকলো ই-কমাৰ্চৰ মূল্য তুলনা কৰক</h2>
        <p>Meesho, Amazon, Flipkart আদিৰ পৰা আটাইতকৈ কম দামটো বিচাৰক</p>
        
        <input type="text" id="searchInput" placeholder="যিকোনো সামগ্ৰীৰ নাম লিখক...">
        <br>
        <button onclick="searchProduct()">সন্ধান কৰক</button>
    </div>

    <div id="results" class="results-container"></div>

    <script src="app.js"></script>

</body>
</html>
